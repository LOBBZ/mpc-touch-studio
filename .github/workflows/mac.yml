name: Mac-app bouwen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bridge met VST3/AU-host bouwen
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pedalboard numpy python-rtmidi
          pyinstaller --noconfirm --onefile --console --name MPC-Touch-Bridge --collect-all pedalboard --hidden-import vst_host --paths bridge --add-data "www:www" --distpath bridge-dist bridge/mpc_bridge.py
      - name: Bridge testen
        run: |
          ./bridge-dist/MPC-Touch-Bridge --dry-run --pin 123456 --port 8899 > bridge.log 2>&1 &
          for i in $(seq 1 30); do sleep 2; curl -s http://127.0.0.1:8899/vst/status && break; done
          echo; cat bridge.log | head -20
          curl -s http://127.0.0.1:8899/vst/status | grep -q '"available": true' || curl -s http://127.0.0.1:8899/vst/status | grep -q '"available":true'
      - name: VMPC2000XL ophalen (echte MPC2000XL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vmpc-dist
          if gh release download "vmpc-$(sed -n 2p vmpc/VMPC_REF)" -R ${{ github.repository }} -p VMPC2000XL-macos-universal.zip -D .; then
            ditto -x -k VMPC2000XL-macos-universal.zip tmpv && cp -R tmpv/VMPC2000XL/* vmpc-dist/
          else echo "::warning::Nog geen VMPC2000XL-release"; fi
          ls -la vmpc-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pakketten installeren
        run: npm install --no-audit --no-fund
      - name: Mac-app bouwen (Apple Silicon), ad-hoc ondertekenen, dmg maken
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          APP="dist/mac-arm64/MPC Touch Studio.app"
          find "$APP/Contents/Resources/vmpc" -maxdepth 1 \( -name "*.app" -o -name "*.vst3" -o -name "*.component" \) -exec codesign --force --deep -s - {} \; 2>/dev/null || true
          [ -f "$APP/Contents/Resources/bridge/MPC-Touch-Bridge" ] && codesign --force -s - "$APP/Contents/Resources/bridge/MPC-Touch-Bridge"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          npx electron-builder --mac dmg zip --arm64 --prepackaged "$APP" --publish never
      - name: Mac-app testen
        run: |
          ls -la dist
          APP="dist/mac-arm64/MPC Touch Studio.app"; echo "$APP"
          codesign -dv "$APP" 2>&1 | head -6 || true
          ls "$APP/Contents/Resources/bridge" "$APP/Contents/Resources/vmpc" 2>&1 || true
          "$APP/Contents/MacOS/MPC Touch Studio" > app.log 2>&1 &
          for i in $(seq 1 30); do sleep 2; R=$(curl -s http://127.0.0.1:8765/vst/status) && [ -n "$R" ] && break; done
          echo "Meegestarte bridge: $R"
          pgrep -fl "MPC Touch Studio" | head -3
          if [ -d "$APP/Contents/Resources/vmpc/VMPC2000XL.app" ]; then open "$PWD/$APP/Contents/Resources/vmpc/VMPC2000XL.app"; sleep 12; pgrep -fl VMPC2000XL && echo "VMPC2000XL draait" || echo "::warning::VMPC2000XL niet zichtbaar gestart"; fi
          pkill -f "MPC Touch Studio" || true; pkill -f VMPC2000XL || true; pkill -f MPC-Touch-Bridge || true
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Touch-Studio-Mac
          path: |
            dist/*.dmg
            dist/*-mac*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-mac
          name: MPC Touch Studio voor Mac (build ${{ github.run_number }})
          make_latest: false
          body: |
            **MPC-Touch-Studio-…-mac-arm64.dmg** — voor MacBooks met Apple-chip (M1 en nieuwer).
            1. Open de dmg en sleep MPC Touch Studio naar Programma's.
            2. Eerste keer: rechtsklik op de app › **Open** › **Open**. (Of Systeeminstellingen › Privacy en beveiliging › **Toch openen**.) De app is niet betaald-gesigneerd door Apple.
            VMPC2000XL (echte MPC2000XL) en de VST3/AU-bridge zitten erin.
          files: |
            dist/*.dmg
            dist/*-mac*.zip
