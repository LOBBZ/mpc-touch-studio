name: Windows-app bouwen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bridge met VST3-host als .exe bouwen (geen Python nodig voor de gebruiker)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pedalboard numpy python-rtmidi
          pyinstaller --noconfirm --onefile --console --name MPC-Touch-Bridge --collect-all pedalboard --hidden-import vst_host --paths bridge --add-data "www;www" --distpath bridge-dist bridge/mpc_bridge.py
      - name: Bridge testen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath bridge-dist\MPC-Touch-Bridge.exe -ArgumentList '--dry-run','--pin','123456','--port','8899' -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-RestMethod http://127.0.0.1:8899/vst/status
          $r | ConvertTo-Json
          Stop-Process -Id $p.Id -Force
          if (-not $r.available) { throw "VST3-host niet beschikbaar in de bridge-exe: $($r.error)" }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pakketten installeren
        run: npm install --no-audit --no-fund
      - name: Windows-app bouwen (installer, portable, zip)
        run: npx electron-builder --win nsis portable zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Bridge los erbij
        run: copy bridge-dist\MPC-Touch-Bridge.exe dist\MPC-Touch-Bridge.exe
      - name: Installatie-zip maken (Installeren.bat + installer)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "dist\MPC-Touch-Studio-Setup-$v.exe" pkg\
          Copy-Item windows-installer\Installeren.bat pkg\
          Copy-Item "windows-installer\LEES MIJ.txt" pkg\
          Compress-Archive -Path pkg\* -DestinationPath "dist\MPC-Touch-Studio-Windows-$v.zip" -Force
      - name: Installatie testen (zoals een gebruiker)
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist\MPC-Touch-Studio-Windows-*.zip).FullName -DestinationPath test-install -Force
          $t0 = Get-Date
          cmd /c "test-install\Installeren.bat < nul"
          Write-Host "Installeren.bat duurde $([int]((Get-Date)-$t0).TotalSeconds) s"
          $found = @("$env:LOCALAPPDATA\Programs\MPC Touch Studio","$env:LOCALAPPDATA\Programs\mpc-touch-studio","$env:ProgramFiles\MPC Touch Studio") | Where-Object { Test-Path "$_\MPC Touch Studio.exe" }
          Write-Host "Geinstalleerd in: $found"
          Get-ChildItem "$env:USERPROFILE\Desktop","$env:PUBLIC\Desktop" -Filter *.lnk -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Snelkoppeling: $($_.FullName)" }
          if (-not $found) {
            Write-Host "--- diagnose ---"
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Programs: $($_.FullName)" }
            Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall","HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | ForEach-Object { $d=(Get-ItemProperty $_.PSPath).DisplayName; if ($d -like "*MPC*") { Write-Host "Uninstall-sleutel: $d -> $((Get-ItemProperty $_.PSPath).InstallLocation)" } }
            Get-Process | Where-Object { $_.Name -like "*MPC*" -or $_.Name -like "*Setup*" } | ForEach-Object { Write-Host "Proces: $($_.Name)" }
            throw "App niet gevonden na installatie"
          }
          $p = Get-Process -Name "MPC Touch Studio" -ErrorAction SilentlyContinue
          Write-Host "App draait: $([bool]$p)"
          $r = $null
          for ($i = 0; $i -lt 30 -and -not $r; $i++) { Start-Sleep -Seconds 2; $r = try { Invoke-RestMethod http://127.0.0.1:8765/vst/status -TimeoutSec 3 } catch { $null } }
          Write-Host "Meegestarte bridge na $($i*2) s: $($r | ConvertTo-Json -Compress)"
          Get-Process | Where-Object { $_.Name -like "*Bridge*" } | ForEach-Object { Write-Host "Bridge-proces: $($_.Name) $($_.Id)" }
          $log = "$env:APPDATA\MPC Touch Studio\bridge.log"
          if (Test-Path $log) { Write-Host "--- bridge.log ---"; Get-Content $log | Select-Object -First 40 | ForEach-Object { Write-Host "LOG $_" } } else { Write-Host "Geen bridge.log in $log"; Get-ChildItem "$env:APPDATA" | Where-Object { $_.Name -like "*MPC*" } | ForEach-Object { Write-Host "AppData: $($_.FullName)" } }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\mpc-touch-studio\resources" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "resources: $($_.Name)" }
          if (-not $r) { Write-Host "::warning::Meegestarte bridge reageert niet" }
          Get-Process -Name "MPC Touch Studio","MPC-Touch-Bridge" -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      - name: Bestanden bewaren
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Touch-Studio-Windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-win
          name: MPC Touch Studio voor Windows (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Installatie-zip**: MPC-Touch-Studio-Windows-….zip → uitpakken → Installeren.bat (installeert direct en start de app)
            **Installer**: MPC-Touch-Studio-Setup-….exe (dubbelklik: installeert direct, snelkoppeling op het bureaublad)
            **Portable**: MPC-Touch-Studio-Portable-….exe (zonder installeren starten)
            **Zip**: uitpakken en `MPC Touch Studio.exe` starten
            **MPC-Touch-Bridge.exe**: alleen nodig als je de app op je telefoon/tablet of in de browser gebruikt en je VST3-plugins op deze pc wilt laden (de Windows-app start de bridge zelf).
          files: |
            dist/*.exe
            dist/*.zip
